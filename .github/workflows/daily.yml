name: Fon Günlük TEFAS Veri Çekimi

on:
  schedule:
    # Europe/Istanbul UTC+3: every weekday at 08:15, before the 09:00 market opening.
    # The collector rechecks recent dates as well as filling gaps, so a delayed
    # TEFAS publication is recovered on the following run without data loss.
    - cron: "15 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: TEFAS verisini çek ve eksikleri iyileştir
        id: collector
        continue-on-error: true
        run: python -m scripts.fetch_tefas

      - name: Degisiklikleri commitle
        run: |
          git config user.name "fon-takip-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ config/
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlanacak."
          else
            git commit -m "Fon verileri guncellendi: $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Collector hatasını bildir
        if: steps.collector.outcome == 'failure'
        run: exit 1
