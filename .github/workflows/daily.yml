name: THF Günlük TEFAS Veri Çekimi

on:
  schedule:
    # Her hafta ici gun 16:30 UTC = 19:30 Turkiye saati (TEFAS gunluk
    # fiyat/buyukluk aciklamasindan sonra). Turkiye yaz/kis saati
    # uygulamiyor (sabit UTC+3).
    - cron: "30 16 * * 1-5"
  workflow_dispatch:
    inputs:
      backfill_days:
        description: "Kac gun geriye donuk veri cekilsin (0 = sadece bugun)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bagimliliklari kur
        run: pip install -r requirements.txt

      - name: TEFAS verisini cek
        run: python scripts/fetch_tefas.py
        env:
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days || '0' }}

      - name: Degisiklikleri commitle
        run: |
          git config user.name "thf-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Degisiklik yok, commit atlanacak."
          else
            git commit -m "THF verisi guncellendi: $(date -u +%Y-%m-%d)"
            git push
          fi
